[package]
kit_sdk_version = "110.*"
authors = ["#xoxor4d <45299104+xoxor4d@users.noreply.github.com>"]
title = "NVIDIA RTX Remix Alpha Card to Mesh Widget"
description = "Job Queue presentation of the Alpha Card to Mesh asset modifier"
version = "1.0.0"
readme = "docs/README.md"
repository = "https://gitlab-master.nvidia.com/lightspeedrtx/lightspeed-kit/-/tree/main/source/extensions/lightspeed.trex.alpha_cutout.widget"
category = "internal"
keywords = ["remix", "alpha", "cutout", "mesh", "modifier", "widget"]
changelog = "docs/CHANGELOG.md"
preview_image = "data/preview.png"
icon = "data/icon.png"

[dependencies]
"lightspeed.common" = {}
"lightspeed.trex.alpha_cutout.modifier" = {}
"lightspeed.trex.asset_modifiers.widget" = {}
"omni.flux.job_queue.core" = {}
"omni.flux.job_queue.widget" = {}
"omni.flux.utils.common" = {}
"omni.kit.notification_manager" = {}
"omni.ui" = {}

[[python.module]]
name = "lightspeed.trex.alpha_cutout.widget"

[[test]]
dependencies = [
    "lightspeed.trex.tests.dependencies",
]

stdoutFailPatterns.exclude = [
    "*[omni.kit.registry.nucleus.utils.common] Skipping deletion of:*",
]

[[test]]
name = "startup"
dependencies = [
    "lightspeed.trex.tests.dependencies",
]
